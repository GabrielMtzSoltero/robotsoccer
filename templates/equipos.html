{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">Registrar Equipo</div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Equipo</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Integrante 1</label>
                        <input type="text" name="integrante1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Integrante 2</label>
                        <input type="text" name="integrante2" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Escudo / Imagen</label>
                        <input type="file" name="escudo" class="form-control" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar Equipo</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Equipos Registrados ({{ equipos|length }})</h3>
            {% if equipos|length >= 3 %}
                <a href="{{ url_for('sortear_grupos') }}" class="btn btn-success">Sortear Grupos ▶</a>
            {% endif %}
        </div>
        <div class="row">
            {% for eq in equipos %}
            <div class="col-md-6 mb-3">
                <div class="card h-100 shadow-sm flex-row align-items-center p-2">
                    <img src="{{ url_for('static', filename='uploads/' + eq.escudo) }}" class="rounded" style="width: 70px; height: 70px; object-fit: contain;">
                    <div class="card-body py-1">
                        <h5 class="card-title mb-1">{{ eq.nombre }}</h5>
                        <p class="card-text text-muted small mb-0">{{ eq.integrante1 }} / {{ eq.integrante2 }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
