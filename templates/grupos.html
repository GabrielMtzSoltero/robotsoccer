{% for p in g.partidos %}
<div class="border-bottom pb-2 mb-2">
    <form method="POST" action="{{ url_for('guardar_resultado_grupo') }}" class="row g-2 align-items-center text-center">
        <!-- Controles de marcadores -->
        <input type="hidden" name="partido_id" value="{{ p.id }}">
        <div class="col-4 text-end small fw-bold">{{ p.local.nombre }}</div>
        <div class="col-2"><input type="number" name="gl" class="form-control form-control-sm text-center" value="{{ p.gl if p.gl is not None else '' }}"></div>
        <div class="col-2"><input type="number" name="gv" class="form-control form-control-sm text-center" value="{{ p.gv if p.gv is not None else '' }}"></div>
        <div class="col-4 text-start small fw-bold">{{ p.visita.nombre }}</div>
        
        <div class="col-12 mt-1 d-flex justify-content-center gap-2">
            <button type="submit" class="btn btn-sm btn-outline-secondary py-0">Guardar</button>
        </div>
    </form>
    
    <!-- BOTÓN PARA ACTIVAR EN OBS -->
    <div class="text-center mt-1">
        {% if p.activo %}
            <span class="badge bg-success">🔴 EN VIVO EN OBS</span>
        {% else %}
            <form action="{{ url_for('activar_partido', tipo='grupo', partido_id=p.id) }}" method="POST" style="display:inline;">
                <button type="submit" class="btn btn-sm btn-outline-danger py-0">📺 Transmitir en OBS</button>
            </form>
        {% endif %}
    </div>
</div>
{% endfor %}
