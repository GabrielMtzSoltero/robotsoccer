<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo de Fútbol - Flask</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">⚽ Torneo Flask</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('equipos') }}">1. Equipos</a>
                <a class="nav-link" href="{{ url_for('grupos') }}">2. Fase de Grupos</a>
                <a class="nav-link" href="{{ url_for('eliminatoria') }}">3. Eliminatoria</a>
            </div>
            <a href="{{ url_for('reiniciar') }}" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Reiniciar todo el torneo?');">Reiniciar Torneo</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
